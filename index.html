<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover : l'app occupe tout l'écran, y compris autour de la Dynamic Island -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2F2F7">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-title" content="FA 4 IT">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>FA 4 IT</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- En-tête : le grand titre de l'écran -->
  <header class="barre-haut">
    <h1 id="titre">FA 4 IT</h1>
  </header>

  <!-- Le contenu de l'écran est inséré ici par js/app.js -->
  <main id="ecran" class="ecran"></main>

  <!-- Les gros boutons d'action, au niveau du pouce, au-dessus des onglets -->
  <div id="actions" class="barre-actions"></div>

  <!-- La barre d'onglets en bas de l'écran -->
  <nav class="barre-onglets" aria-label="Navigation principale">
    <a class="onglet" href="#/programme" data-onglet="programme">Programme</a>
    <a class="onglet" href="#/seance" data-onglet="seance">Séance</a>
    <a class="onglet" href="#/historique" data-onglet="historique">Historique</a>
    <a class="onglet" href="#/sauvegarde" data-onglet="sauvegarde">Sauvegarde</a>
  </nav>

  <!-- Petit message temporaire (ex. « Enregistré ») -->
  <div id="message" class="message" role="status" aria-live="polite"></div>

  <!-- type="module" : permet de découper le code JavaScript en plusieurs fichiers -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
